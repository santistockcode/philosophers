[tox]
envlist = unit, e2e
skipsdist = True
isolated_build = False

[testenv]
description = Base environment configuration
deps =
    pytest>=7.0
    pytest-timeout>=2.1.0
    pexpect>=4.8.0
setenv =
    PHILOSOPHERS_ROOT = {toxinidir}
passenv =
    HOME
    USER
    PATH
    TERM
allowlist_externals =
    make
    cc
    rm
    bash
    find
    valgrind

# ============================================================================
# Unit Tests (C with minunit)
# ============================================================================

[testenv:unit]
description = Compile and run C unit tests using minunit
commands =
    python {toxinidir}/tests/support/scripts/compile_unit_tests.py --run

[testenv:unit-debug]
description = Unit tests with debug flags, keep binaries
commands =
    python {toxinidir}/tests/support/scripts/compile_unit_tests.py --run --keep_bin --debug

[testenv:unit-valgrind]
description = Unit tests under valgrind --tool=helgrind (data race detection)
commands =
    python {toxinidir}/tests/support/scripts/compile_unit_tests.py --run --valgrind

[testenv:unit-tsan]
description = Unit tests compiled with -fsanitize=thread
commands =
    python {toxinidir}/tests/support/scripts/compile_unit_tests.py --run --fsanitize thread

[testenv:unit-asan]
description = Unit tests compiled with -fsanitize=address
commands =
    python {toxinidir}/tests/support/scripts/compile_unit_tests.py --run --fsanitize address

# ============================================================================
# E2E Tests (pexpect - test philo binary output)
# ============================================================================

[testenv:e2e]
description = End-to-end tests on philo binary output
commands_pre =
    make -C {toxinidir} re
commands =
    pytest {toxinidir}/tests/e2e -v -s

[testenv:e2e-valgrind]
description = E2E tests with helgrind data-race checks
commands_pre =
    make -C {toxinidir} re
commands =
    pytest {toxinidir}/tests/e2e -v -s -k "valgrind" --timeout=60

[testenv:e2e-tsan]
description = E2E tests on binary compiled with -fsanitize=thread
commands_pre =
    make -C {toxinidir} fsanitize
commands =
    pytest {toxinidir}/tests/e2e -v -s --timeout=30

[testenv:e2e-asan]
description = E2E tests on binary compiled with -fsanitize=address
commands_pre =
    make -C {toxinidir} fsanitize-addr
commands =
    pytest {toxinidir}/tests/e2e -v -s --timeout=30

# ============================================================================
# Combined: Run All (safety check before pushing)
# ============================================================================

[testenv:all]
description = Run unit tests + e2e tests (full regression)
commands_pre =
    make -C {toxinidir} re
commands =
    python {toxinidir}/tests/support/scripts/compile_unit_tests.py --run
    pytest {toxinidir}/tests/e2e -v -s

[testenv:all-valgrind]
description = Full regression under helgrind
commands_pre =
    make -C {toxinidir} re
commands =
    python {toxinidir}/tests/support/scripts/compile_unit_tests.py --run --valgrind
    pytest {toxinidir}/tests/e2e -v -s --timeout=60

[testenv:all-tsan]
description = Full regression with thread sanitizer
commands_pre =
    make -C {toxinidir} fsanitize
commands =
    python {toxinidir}/tests/support/scripts/compile_unit_tests.py --run --fsanitize thread
    pytest {toxinidir}/tests/e2e -v -s --timeout=30

# ============================================================================
# Debug Build
# ============================================================================

[testenv:debug-build]
description = Compile philo with debug flags for GDB/LLDB
commands =
    make -C {toxinidir} debug
    bash -c 'echo "" && echo "✅ Debug binary ready: {toxinidir}/philo" && echo "Run: gdb ./philo" && echo ""'

# ============================================================================
# Cleanup
# ============================================================================

[testenv:clean]
description = Clean all test artifacts and build files
commands =
    make -C {toxinidir} fclean
    python {toxinidir}/tests/support/scripts/compile_unit_tests.py --clean
    rm -rf {toxinidir}/.pytest_cache
    find {toxinidir} -type d -name "__pycache__" -exec rm -rf {} +